<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My 2025 Personal Website</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style2.css">
    <link rel="icon" type="image/x-icon" href="/pic/favicon.ico">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#home">2025 Personal</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#home">首頁</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#about">關於我</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#projects">我的專案</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#contact">聯絡我</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-6 hero-content fade-in">
                    <h1 id="name"></h1>
                    <p class="subtitle" id="title"></p>
                    <div class="mb-3">
                        <strong>專業領域：</strong>
                        <span id="expertise"></span>
                    </div>
                    <div class="mb-3">
                        <strong>學歷：</strong>
                        <span id="education"></span>
                    </div>
                    <div class="mb-4">
                        <strong>聯絡信箱：</strong>
                        <a href="mailto:" class="text-primary" id="email"></a>
                    </div>
                </div>
                <div class="col-lg-6 text-center fade-in">
                    <img src="pic/mypic.jpg" alt="Dr. Pin Luarn" class="profile-img">
                </div>
            </div>
        </div>
         <!-- 🔽 加在這裡！在 container 後面 -->
        <div class="bubbles">
            <span></span><span></span><span></span><span></span><span></span>
        </div>
</section>

    <!-- About Section -->
    <section id="about" class="section">
        <div class="container">
            <h2 class="section-title">關於Debbie</h2>
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card fade-in">
                        <div class="card-body p-4">
                            <p class="lead text-center" id="about-text">
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Projects Section -->
    <section id="projects" class="section bg-light">
        <div class="container">
            <h2 class="section-title">我的專案</h2>

            <!-- Filter Buttons -->
            <div class="filter-buttons fade-in">
                <button class="btn filter-btn active" onclick="filterProjects('all')">All</button>
                <button class="btn filter-btn" onclick="filterProjects('innovation')">Innovation & Strategy</button>
                <button class="btn filter-btn" onclick="filterProjects('marketing')">Marketing & Communication</button>
                <button class="btn filter-btn" onclick="filterProjects('technology')">Technology & Insight</button>
                <button class="btn filter-btn" onclick="filterProjects('leadership')">Leadership & Growth</button>
            </div>

            <!-- Projects Grid -->
            <div class="project-grid fade-in" id="projects-grid">
                <!-- Projects will be dynamically generated -->
            </div>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="section bg-light">
        <div class="container">
            <h2 class="section-title">聯絡我</h2>
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="contact-info fade-in">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="contact-item">
                                    <i class="fas fa-envelope"></i>
                                    <div>
                                        <strong>電子郵件</strong><br>
                                        <a href="mailto:" class="text-primary" id="contact-email1"></a><br>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="contact-item">
                                    <i class="fas fa-phone"></i>
                                    <div>
                                        <strong>電話</strong><br>
                                        <span id="contact-phone"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="contact-item">
                            <i class="fas fa-map-marker-alt"></i>
                            <div>
                                <strong>位置</strong><br>
                                <span id="contact-location"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Wen-Yu Chen.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>

    <script>
        // ====== 使用者資料區域 - 請修改以下內容 ======
        const profileData = {
            name: "陳玟妤 Debbie",
            title: "Turning Data & Ideas into Impact — AI×Branding Explorer",
            expertise: "Strategic Branding, Data Analytics, ESG Communication, Generative AI ",
            education: "臺灣科技大學企業管理系碩士 | 國立高雄大學企管系（主修）；財經法律系（輔系）",
            email: "dcwy0514@mail.ntust.edu.tw",
            about: "Curious, creative, and committed to change — I bring a diverse background in business, law, and emerging tech to every project I join. From ESG research and AI analytics to campus events and brand campaigns, I love making ideas happen. I thrive in roles that combine big-picture thinking with hands-on execution, especially when it involves teamwork, innovation, and social impact.",
            contactEmail: "M11308043@mail.ntust.edu.tw",
            phone: "0968766567",
            location: "實驗室: T2-409<br>國立臺灣科技大學"
        };
        // ====== 使用者資料區域結束 ======

        // Project data
        const projects = [
            {id: 1, category: 'innovation', title: 'IONEX × TOURNII Co-Branding Campaign', description: 'Innovation & Strategy'},
            {id: 2, category: 'innovation', title: 'NAPL Customer Segmentation', description: 'Innovation & Strategy'},
            {id: 3, category: 'innovation', title: 'ASICS Omnichannel Experience Redesign', description: 'Innovation & Strategy'},
            {id: 4, category: 'marketing', title: 'Clinique 14-Day IG Campaign', description: 'Marketing & Communication'},
            {id: 5, category: 'marketing', title: 'Pamela Reif on Xiaohongshu', description: 'Marketing & Communication'},
            {id: 6, category: 'marketing', title: 'Brand Enhancement Strategies of McDonald\'s', description: 'Marketing & Communication'},
            {id: 7, category: 'technology', title: 'Stock Price Prediction Model', description: 'Technology & Insight'},
            {id: 8, category: 'technology', title: 'Tech Policy Internship', description: 'Technology & Insight'},
            {id: 9, category: 'technology', title: 'Python Automation System', description: 'Technology & Insight'},
            {id: 10, category: 'leadership', title: 'Teaching Assistant', description: 'Leadership & Growth'},
            {id: 11, category: 'leadership', title: 'Google Certifications', description: 'Leadership & Growth'},
            {id: 12, category: 'leadership', title: 'BBA + Minor in Financial & Economic Law', description: 'Leadership & Growth'}
        ];

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            loadProfileData();
            renderProjects('all');
            initScrollAnimations();
            initSmoothScrolling();
        });

        // Load profile data
        function loadProfileData() {
            // Update home section
            document.getElementById('name').textContent = profileData.name;
            document.getElementById('title').textContent = profileData.title;
            document.getElementById('expertise').textContent = profileData.expertise;
            document.getElementById('education').textContent = profileData.education;
            document.getElementById('email').textContent = profileData.email;
            document.getElementById('email').href = `mailto:${profileData.email}`;

            // Update about section
            document.getElementById('about-text').textContent = profileData.about;

            // Update contact section
            const contactEmail = profileData.contactEmail || profileData.email;
            document.getElementById('contact-email1').textContent = contactEmail;
            document.getElementById('contact-email1').href = `mailto:${contactEmail}`;
            document.getElementById('contact-phone').textContent = profileData.phone;
            document.getElementById('contact-location').innerHTML = profileData.location;
        }

        // Filter and render projects
        function filterProjects(category) {
            // Update active button
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            renderProjects(category);
        }

        function renderProjects(category) {
            const grid = document.getElementById('projects-grid');
            const filteredProjects = category === 'all' ? projects : projects.filter(p => p.category === category);

            grid.innerHTML = filteredProjects.map(project => {
                return `
                    <div class="project-card" data-category="${project.category}" onclick="openProject(${project.id})">
                        <div class="project-number">${project.id}</div>
                        <h5>${project.title}</h5>
                        <p class="text-muted">${project.description}</p>
                        <small class="text-primary">點擊查看詳情</small>
                    </div>
                `;
            }).join('');
        }

        // Open project details
        function openProject(id) {
            // Navigate to unit.html with unit ID as parameter
            window.open(`unit.html?unit=${id}`, '_blank');
        }

        // Scroll animations
        function initScrollAnimations() {
            const observerOptions = {
                threshold: 0.1,
                rootMargin: '0px 0px -50px 0px'
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.fade-in').forEach(el => {
                observer.observe(el);
            });
        }

        // Smooth scrolling for navigation links
        function initSmoothScrolling() {
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                    e.preventDefault();
                    const target = document.querySelector(this.getAttribute('href'));
                    if (target) {
                        const headerOffset = 70;
                        const elementPosition = target.getBoundingClientRect().top;
                        const offsetPosition = elementPosition + window.pageYOffset - headerOffset;

                        window.scrollTo({
                            top: offsetPosition,
                            behavior: 'smooth'
                        });
                    }
                });
            });
        }

        // Navbar background on scroll
        window.addEventListener('scroll', function() {
            const navbar = document.querySelector('.navbar');
            if (window.scrollY > 50) {
                navbar.style.background = 'rgba(255,255,255,0.98)';
            } else {
                navbar.style.background = 'rgba(255,255,255,0.95)';
            }
        });
    </script>
</body>
</html>
