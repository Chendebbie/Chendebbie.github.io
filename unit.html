        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            color: #333;

            background: rgba(255,255,255,0.95);

            font-weight: bold;
            color: #3498db !important;
        }

        .unit-nav-container {

            top: 50%;
            transform: translateY(-50%);
            z-index: 1000;
            pointer-events: none;
        }

        .unit-nav-left {
            left: 20px;
        }

        .unit-nav-right {
            right: 20px;
        }

        .unit-nav-btn {
            background: rgba(52, 152, 219, 0.7);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            pointer-events: auto;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
            backdrop-filter: blur(10px);
        }

        .unit-nav-btn:hover {
            background: rgba(52, 152, 219, 1);
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
        }

        .unit-nav-btn:disabled {
            background: rgba(200, 200, 200, 0.5);
            color: rgba(255, 255, 255, 0.5);
            cursor: not-allowed;
            box-shadow: none;
        }

        .unit-counter {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(52, 152, 219, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 500;
            z-index: 1000;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
        }

        .project-header {
            background: linear-gradient(135deg, #3498db 0%, #9b59b6 100%);
            color: white;
            padding: 60px 0 40px;
            margin-bottom: 40px;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.3s ease;
        }

        .back-btn:hover {
            color: white;
            transform: translateX(-5px);
        }

        .breadcrumb {
            background: none;
            padding: 0;
            margin: 0 0 20px 0;
        }

        .breadcrumb-item a {
            color: rgba(255,255,255,0.8);
            text-decoration: none;
        }

        .breadcrumb-item.active {
            color: white;
        }

        .project-title {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .project-subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 0;
        }

        /* Content Section */
        .content-section {
            margin-bottom: 50px;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s ease;
        }

        .content-section.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .section-title {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 30px;
            color: #2c3e50;
            position: relative;
            padding-bottom: 10px;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 50px;
            height: 3px;
            background: linear-gradient(90deg, #3498db, #9b59b6);
        }

        /* Media Gallery Styles */
        .media-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }

        .media-item {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .media-item:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .media-preview {
            width: 100%;
            height: 200px;
            background: linear-gradient(45deg, #f1f2f6, #e9ecef);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .media-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .media-icon {
            font-size: 3rem;
            color: #3498db;
            margin-bottom: 10px;
        }

        .media-info {
            padding: 20px;
        }

        .media-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .media-description {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .media-type {
            display: inline-block;
            background: linear-gradient(45deg, #3498db, #9b59b6);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        /* File Upload Area */
        .file-upload-area {
            border: 2px dashed #3498db;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            background: rgba(52, 152, 219, 0.05);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .file-upload-area:hover {
            border-color: #2980b9;
            background: rgba(52, 152, 219, 0.1);
        }

        .file-upload-area.drag-over {
            border-color: #9b59b6;
            background: rgba(155, 89, 182, 0.1);
        }

        .upload-icon {
            font-size: 2.5rem;
            color: #3498db;
            margin-bottom: 15px;
        }

        .upload-text {

        }

        .upload-hint {
            font-size: 0.9rem;
            color: #bdc3c7;
        }

        /* Hidden file input */
        .file-input {
            display: none;
        }

        /* Modal Styles */
        .modal-content {
            border: none;
            border-radius: 15px;
            overflow: hidden;
        }

        .modal-header {
            background: linear-gradient(135deg, #3498db 0%, #9b59b6 100%);

            border-bottom: none;
        }

        .btn-close {
            filter: brightness(0) invert(1);
        }

        /* Responsive */
        @media (max-width: 768px) {

            }

            }

            }

        /* Animation */
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s ease;
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);

</head>

                    { id: 2, title: "課程紀錄", type: "image", description: "主修與輔修課程學習紀錄" },
                    { id: 3, title: "專題報告", type: "presentation", description: "畢業專題與研究報告" }
                ]
            }
        };

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            // Get unit number from URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            currentUnit = parseInt(urlParams.get('unit')) || 1;

            // Validate unit number
            if (currentUnit < 1 || currentUnit > totalUnits) {
                currentUnit = 1;
            }

            updatePageContent();
            generateMediaGallery();
            updateNavigation();
            initScrollAnimations();
            initFileUpload();
            initKeyboardNavigation();
        });

        // Update page content
        function updatePageContent() {
            const unit = unitInfo[currentUnit];
            if (!unit) return;

            document.getElementById('project-title').textContent = unit.name;
            document.getElementById('project-subtitle').textContent = unit.category;
            document.getElementById('breadcrumb-unit').textContent = unit.name;
            document.getElementById('project-description').textContent = unit.description;
            document.title = `${unit.name} | 2025 Personal Website`;
        }

        // Generate media gallery
        function generateMediaGallery() {
            const unit = unitInfo[currentUnit];
            if (!unit) return;

            const gallery = document.getElementById('mediaGallery');
            gallery.innerHTML = '';

            unit.mediaSlots.forEach(slot => {
                const mediaItem = createMediaItem(slot);
                gallery.appendChild(mediaItem);
            });
        }

        // Create media item
        function createMediaItem(slot) {
            const div = document.createElement('div');
            div.className = 'media-item';
            div.onclick = () => openMediaModal(slot);

            const iconClass = getMediaIcon(slot.type);
            
            div.innerHTML = `
                <div class="media-preview">
                    <div class="text-center">
                        <i class="${iconClass} media-icon"></i>
                        <div class="upload-text">點擊上傳${slot.title}</div>
                    </div>
                </div>
                <div class="media-info">
                    <div class="media-title">${slot.title}</div>
                    <div class="media-description">${slot.description}</div>
                    <span class="media-type">${getMediaTypeName(slot.type)}</span>
                </div>
            `;

            return div;
        }

        // Get media icon
        function getMediaIcon(type) {
            const icons = {
                document: 'fas fa-file-alt',
                image: 'fas fa-image',
                video: 'fas fa-video',
                presentation: 'fas fa-file-powerpoint'
            };
            return icons[type] || 'fas fa-file';
        }

        // Get media type name
        function getMediaTypeName(type) {
            const names = {
                document: '文檔',
                image: '圖片',
                video: '影片',
                presentation: '簡報'
            };
            return names[type] || '文件';
        }

        // Open media modal
        function openMediaModal(slot) {
            const modal = new bootstrap.Modal(document.getElementById('uploadModal'));
            modal.show();
        }

        // Initialize file upload
        function initFileUpload() {
            const fileInput = document.getElementById('fileInput');
            const uploadArea = document.getElementById('fileUploadArea');

            uploadArea.addEventListener('click', () => {
                fileInput.click();
            });

            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.classList.add('drag-over');
            });

            uploadArea.addEventListener('dragleave', () => {
                uploadArea.classList.remove('drag-over');
            });

            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.classList.remove('drag-over');
                const files = e.dataTransfer.files;
                handleFileUpload(files);
            });

            fileInput.addEventListener('change', (e) => {
                const files = e.target.files;
                handleFileUpload(files);
            });
        }

        // Handle file upload

            modal.hide();

            // 顯示成功消息
            alert('文件上傳成功！');
        }

        function navigateToUnit(unitNumber) {
            if (unitNumber >= 1 && unitNumber <= totalUnits && unitNumber !== currentUnit) {
                window.location.href = `unit.html?unit=${unitNumber}`;
            }
        }

        // Update navigation
        function updateNavigation() {
            const prevBtn = document.getElementById('prevUnitBtn');
            const nextBtn = document.getElementById('nextUnitBtn');
            const unitCounter = document.getElementById('unitCounter');

            unitCounter.textContent = `專案 ${currentUnit} / ${totalUnits}`;

            prevBtn.disabled = currentUnit <= 1;
            nextBtn.disabled = currentUnit >= totalUnits;
        }
